<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sha3bytk | صور الضمان</title>
  <meta name="description" content="Sha3bytk - صور ضمانات شعبية PUBG" />
  <link rel="icon" type="image/png" href="https://i.ibb.co/YJYrcxZ/sha3bytk.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/public/css/warranty-images.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="https://i.ibb.co/YJYrcxZ/sha3bytk.png" alt="Sha3bytk" draggable="false" />
        <div class="logo-text">
          <strong>Sha3bytk</strong>
          <span data-i18n="tagline">بيع • اشتري • شعبيتك</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="/" class="back-btn" data-i18n="back">رجوع</a>
        <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle theme">Dark</button>
        <button type="button" class="lang-btn" id="langBtn" aria-label="Switch language">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="page-badge" data-i18n="badge">سجل الضمانات</span>
        <h1 data-i18n="title">صور الضمان</h1>
        <p data-i18n="sub">
          كل صور الضمانات السابقة التي تم توثيقها. اضغط على أي صورة لعرضها بحجم أكبر.
        </p>
      </div>
    </section>

    <section class="gallery-wrap">
      <div class="container">
        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            class="toolbar-input"
            placeholder="ابحث بالعنوان أو الملاحظة"
            data-i18n-ph="searchPh"
          />
          <button type="button" class="refresh-btn" id="refreshBtn" data-i18n="refresh">تحديث</button>
        </div>

        <div class="grid" id="grid"></div>

        <div class="empty" id="empty" hidden data-i18n="empty">لا توجد صور بعد</div>

        <div class="loader" id="loader" data-i18n="loading">جارٍ التحميل...</div>
      </div>
    </section>
  </main>

  <div class="modal" id="imgModal" hidden>
    <div class="modal-box img-modal">
      <div class="modal-head">
        <h3 id="imgTitle" data-i18n="imagePreview">معاينة الصورة</h3>
        <button type="button" class="modal-close" id="imgClose" aria-label="close">×</button>
      </div>
      <div class="modal-body center">
        <img id="imgLarge" alt="preview" draggable="false" />
        <p class="img-note" id="imgNote" hidden></p>
        <p class="img-date" id="imgDate"></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>
        &copy; <span id="year"></span> Sha3bytk.
        <span data-i18n="rights">جميع الحقوق محفوظة.</span>
      </p>
    </div>
  </footer>

  <script src="/public/js/warranty-images.js" defer></script>
</body>
</html>
